<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>POPOPX 服务号管理后台</title>
<style>
:root {
  --bg: #0b0e13;
  --bg-2: #0e131b;
  --sec: #111722;
  --sec-2: #161e2b;
  --line: #223046;
  --line-soft: #1a2432;
  --fg: #dbe4ef;
  --fg-2: #a8b7c8;
  --fg-3: #74869b;
  --brand: #2fbfa0;
  --brand-2: #1b6d5c;
  --good: #4bbf7f;
  --warn: #e0a458;
  --bad: #e0575f;
  --info: #63a4e8;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
}
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.006em; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
/* Every flex row that ends with buttons pushes them to the right with this, so it has
 * to be a global utility: #bar, .row and .result > .rh all use it. */
.grow { flex: 1; }

/* ── shell ─────────────────────────────────────────────────────────────── */
#shell { display: none; height: 100%; grid-template-rows: auto 1fr; grid-template-columns: 216px 1fr; }
#shell.on { display: grid; }
#bar {
  grid-column: 1 / 3; display: flex; align-items: center; gap: 14px;
  padding: 0 16px; height: 50px; background: var(--bg-2);
  border-bottom: 1px solid var(--line);
}
#bar .mark { font-weight: 650; letter-spacing: 0.02em; color: var(--fg); }
#bar .mark b { color: var(--brand); font-weight: 650; }
#bar .sep { width: 1px; height: 18px; background: var(--line); }
#bar .meta { color: var(--fg-3); font-size: 12px; }
#side {
  overflow-y: auto; padding: 10px 0 24px; background: var(--bg-2);
  border-right: 1px solid var(--line);
}
#side .grp { padding: 14px 16px 4px; font-size: 10.5px; letter-spacing: 0.1em; color: var(--fg-3); text-transform: uppercase; }
#side a {
  display: flex; align-items: center; gap: 8px; padding: 6px 16px;
  color: var(--fg-2); border-left: 2px solid transparent; font-size: 13.5px;
}
#side a:hover { background: var(--sec); color: var(--fg); text-decoration: none; }
#side a.act { color: var(--fg); background: var(--sec-2); border-left-color: var(--brand); }
#side a .n { margin-left: auto; font: 11px var(--mono); color: var(--fg-3); }
#stage { overflow-y: auto; padding: 20px 24px 80px; }
#stage > .wrap { max-width: 1240px; }

/* ── login ─────────────────────────────────────────────────────────────── */
#gate { display: flex; align-items: center; justify-content: center; height: 100%; padding: 24px; }
#gate .box { width: min(460px, 100%); background: var(--sec); border: 1px solid var(--line); border-radius: 8px; padding: 26px; }
#gate h1 { font-size: 19px; margin-bottom: 4px; }
#gate p { margin: 0 0 18px; color: var(--fg-3); font-size: 12.5px; }
#gate .err { margin-top: 12px; font-size: 12.5px; color: var(--bad); min-height: 18px; }

/* ── sections ──────────────────────────────────────────────────────────── */
.sec { background: var(--sec); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
.sec > header {
  display: flex; align-items: baseline; gap: 10px; padding: 12px 16px;
  border-bottom: 1px solid var(--line-soft); background: var(--sec-2);
}
.sec > header h3 { font-size: 14px; }
.sec > header .note { color: var(--fg-3); font-size: 11.5px; }
.sec > header .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.sbody { padding: 14px 16px 16px; }
.sbody > * + * { margin-top: 12px; }
h4.sub { font-size: 12px; color: var(--fg-2); letter-spacing: 0.02em; margin: 18px 0 8px; padding-top: 12px; border-top: 1px dashed var(--line-soft); }
h4.sub:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.split { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.end { justify-content: flex-end; }
.empty { color: var(--fg-3); font-size: 12.5px; margin: 2px 0 0; font-style: italic; }
.hint { color: var(--fg-3); font-size: 11.5px; }
.warnline { color: var(--warn); font-size: 12px; }
.adv { margin-top: 8px; }
.adv > summary { cursor: pointer; color: var(--fg-3); font-size: 12px; }
.adv > div { margin-top: 8px; }
img.qr { display: block; width: 180px; height: 180px; background: #fff; padding: 8px; border-radius: 10px; }

/* ── controls ──────────────────────────────────────────────────────────── */
.in {
  width: 100%; padding: 6px 9px; color: var(--fg); background: var(--bg-2);
  border: 1px solid var(--line); border-radius: 5px; font: 13px var(--sans);
}
textarea.in { font-family: var(--mono); font-size: 12.5px; line-height: 1.45; resize: vertical; }
.in.mono { font-family: var(--mono); font-size: 12.5px; }
.in.mini { width: auto; min-width: 120px; }
.in:focus { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 2px rgba(47,191,160,0.14); }
select.in { appearance: none; padding-right: 24px;
  background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%), linear-gradient(135deg, var(--fg-3) 50%, transparent 50%);
  background-position: right 12px top 13px, right 8px top 13px; background-size: 4px 4px; background-repeat: no-repeat; }
.in[disabled] { opacity: 0.5; }
label.fld { display: block; }
label.fld > span.fl { display: block; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 4px; }
label.fld > span.fh { display: block; font-size: 11px; color: var(--fg-3); margin-top: 4px; }
label.ck { display: flex; gap: 7px; align-items: center; font-size: 12.5px; color: var(--fg-2); }
label.ck input { accent-color: var(--brand); margin: 0; }
.btn {
  padding: 6px 12px; border: 1px solid var(--line); border-radius: 5px;
  background: var(--sec-2); color: var(--fg); font: 12.5px var(--sans); cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--brand-2); background: #1a2432; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.pri { background: var(--brand-2); border-color: #228a74; color: #eafffa; }
.btn.pri:hover:not(:disabled) { background: #249071; }
.btn.dan { border-color: #5a2b30; color: #f0b6ba; }
.btn.dan:hover:not(:disabled) { background: #2a1719; border-color: var(--bad); }
.btn.mini { padding: 3px 8px; font-size: 11.5px; }
.btn.gho { background: transparent; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.tabs button {
  padding: 6px 11px; border: 0; border-bottom: 2px solid transparent; background: none;
  color: var(--fg-3); font: 12.5px var(--sans); cursor: pointer;
}
.tabs button.act { color: var(--fg); border-bottom-color: var(--brand); }

/* ── tables ────────────────────────────────────────────────────────────── */
.twrap { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 6px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.tbl th {
  text-align: left; padding: 7px 10px; font-size: 10.5px; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--fg-3); background: var(--bg-2);
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
table.tbl tr:last-child td { border-bottom: 0; }
table.tbl tbody tr:hover td { background: #141c28; }
td.nil, .nil { color: #4a586c; }
.kv { display: grid; grid-template-columns: 148px 1fr; gap: 5px 12px; font-size: 12.5px; }
.kv > dt { color: var(--fg-3); }
.kv > dd { margin: 0; word-break: break-word; }
pre.dump {
  margin: 0; padding: 10px 12px; max-height: 340px; overflow: auto;
  background: #080b10; border: 1px solid var(--line-soft); border-radius: 6px;
  font: 11.5px/1.5 var(--mono); color: #b9c8da; white-space: pre-wrap; word-break: break-word;
}
code.mono { font-family: var(--mono); font-size: 12px; color: #c8d6e6; word-break: break-all; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg-2); font-size: 11px; color: var(--fg-2);
}
.chip.g { border-color: #245c3d; color: #96dcb3; }
.chip.w { border-color: #5d4820; color: #eac489; }
.chip.b { border-color: #5a2b30; color: #efa7ac; }
.chip.i { border-color: #24486b; color: #9cc6f2; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); display: inline-block; }
.dot.g { background: var(--good); box-shadow: 0 0 0 3px rgba(75,191,127,0.16); }
.dot.b { background: var(--bad); }
.dot.w { background: var(--warn); }
.bar { height: 5px; border-radius: 3px; background: var(--line-soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand-2); }
.count { font: 11px var(--mono); color: var(--fg-3); }
.count.over { color: var(--bad); }
.result { border: 1px solid var(--line-soft); border-radius: 6px; background: var(--bg-2); }
.result > .rh {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line-soft);
  font-size: 11.5px; color: var(--fg-3);
}
.result > .rh b { color: var(--fg-2); font-weight: 500; font-size: 12px; }
.result > .rb { padding: 0; }
.result > .rb pre.dump { border: 0; border-radius: 0; max-height: 280px; }
.errbox { padding: 10px 12px; border: 1px solid #4b2429; border-radius: 6px; background: #1d1215; }
.errbox .em { color: #f2b8bc; font-size: 12.5px; }
.errbox .ec { font-family: var(--mono); font-size: 11.5px; color: #d59aa0; }
.errbox pre.dump { margin-top: 8px; background: #150e11; border-color: #3a2126; }
#toast { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
#toast div {
  padding: 9px 13px; border-radius: 6px; border: 1px solid var(--line); background: var(--sec-2);
  font-size: 12.5px; box-shadow: 0 8px 26px rgba(0,0,0,0.42); max-width: 380px;
}
#toast div.bad { border-color: #5a2b30; }
#toast div.good { border-color: #245c3d; }
.reps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.rep { border: 1px solid var(--line-soft); border-radius: 6px; padding: 10px 12px; background: var(--bg-2); }
.rep .rl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-3); }
.rep .rv { font: 600 21px/1.25 var(--mono); margin-top: 3px; }
.rep .rs { font-size: 11.5px; color: var(--fg-3); }
.item { border: 1px solid var(--line); border-radius: 6px; background: var(--sec-2); padding: 10px 12px; }
.item + .item { margin-top: 8px; }
.item .ih { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.item .ih .t { font-weight: 600; font-size: 13px; }
.item .ih .sp { margin-left: auto; display: flex; gap: 4px; }
.item .in + .in, .item .fld + .fld { margin-top: 7px; }
.subs { margin: 8px 0 0 14px; padding-left: 10px; border-left: 1px dashed var(--line); }
@media (max-width: 980px) {
  #shell { grid-template-columns: 1fr; }
  #side { display: none; }
  #bar { grid-column: 1; }
  .split { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="gate">
  <form class="box" id="gateform" autocomplete="off">
    <h1>POPOPX 服务号管理后台</h1>
    <p>管理令牌即 <code class="mono">POPOPX_ADMIN_TOKEN</code>，只在浏览器内存与本次会话中保存；请求以 <code class="mono">x-admin-token</code> 与 <code class="mono">Authorization</code> 两种头部发送。</p>
    <label class="fld"><span class="fl">管理令牌</span><input class="in mono" id="tokin" type="password" placeholder="sk-popopx-…" autocomplete="off"></label>
    <div class="row" style="margin-top:14px">
      <button class="btn pri" type="submit" id="tokgo">进入控制台</button>
      <button class="btn" type="button" id="tokping">检查连通</button>
      <span class="hint" id="tokbase"></span>
    </div>
    <div class="err" id="tokerr"></div>
  </form>
</div>

<div id="shell">
  <div id="bar">
    <a class="mark" id="markhome" title="回到控制台首页"><b>POPOPX</b> 服务号</a>
    <span class="sep"></span>
    <span id="barsvc" class="meta">—</span>
    <span class="grow"></span>
    <span id="barbill" class="chip">计费 —</span>
    <span id="barnode" class="chip"><i class="dot"></i>节点 —</span>
    <button class="btn mini gho" type="button" id="barref">刷新</button>
    <button class="btn mini gho" type="button" id="barout">退出</button>
  </div>
  <nav id="side"></nav>
  <main id="stage"><div class="wrap" id="view"></div></main>
</div>

<div id="toast"></div>

<script>
"use strict";
(function () {
/* ======================================================================== *
 * 1. 协议词汇表 —— 与 app/crypto_service.py、app/main.py 同源，改动必须同步
 * ======================================================================== */

var LIMITS = {
  frame_chars: 8192, card_id: 64, card_title: 120, card_body: 2000,
  field_label: 80, field_value: 240, payload: 512, url: 2048,
  max_fields: 8, max_actions: 4, max_menu_items: 3, max_menu_subitems: 5,
  max_menu_title_chars: 80, progress_min: 0, progress_max: 100,
  credits_min: 1, credits_max: 100000, secret_hex_chars: 64,
  pairwise_uid: 128, service_id: 128, max_epoch: 1000000
};

var MENU_ITEM_KINDS = ["click", "view", "scancode", "location", "click_text"];
var MENU_ACTION_KINDS = ["open_url", "send_cmd", "open_channel", "callback"];
var CARD_ACTION_KINDS = ["callback", "pay_credits", "open_url", "open_channel", "send_cmd"];
var ACTION_STYLES = ["primary", "secondary", "destructive"];
var CARD_STYLES = ["standard", "receipt", "security"];
var CARD_STATES = ["draft", "sent", "delivered", "settled", "failed"];
var ALERT_SEVERITY = ["silent", "debug", "info", "warning", "critical"];
var ALERT_STATUS = ["firing", "acknowledged", "resolved"];
var SSO_STATE = ["pending", "scanned", "confirmed", "delivered", "expired", "cancelled"];
var VOUCHER_STATUS = ["issued", "redeemed", "revoked", "expired"];
var POLL_MODES = ["anonymous", "signed"];
var WEB3_CHAINS = ["evm", "solana"];

/* 中文标签，只影响显示，不影响任何线上值。 */
var L = {
  card_state: { draft: "草稿", sent: "已发送", delivered: "已送达", settled: "已完成", failed: "失败" },
  alert_status: { firing: "待确认", acknowledged: "已确认", resolved: "已解决" },
  alert_severity: { silent: "静默", debug: "调试", info: "提示", warning: "警告", critical: "严重" },
  sso_state: { pending: "等待扫码", scanned: "已扫码", confirmed: "已确认", delivered: "已签发", expired: "已过期", cancelled: "已取消" },
  voucher_status: { issued: "未兑换", redeemed: "已兑换", revoked: "已作废", expired: "已过期" },
  billing_status: { DRAFT: "未激活（准入模式）", ONLINE: "在线", SUSPENDED: "已停用" },
  poll_state: { open: "进行中", closed: "已结束" },
  member_status: { active: "有效", revoked: "已收回", expired: "已过期" }
};
function lab(group, v) { var m = L[group]; return (m && m[v]) || v || "—"; }

/* 全部 HTTP 表面积。`main.py::self_test()` 会逐条比对服务端注册的路由，
 * 因此这张表要么与网关一致，要么启动自检直接失败。表里的每一项都必须真的被
 * call() 调用：不被调用的路径写在这里只会让比对多算一项、少发现一处漂移。 */
var API = {
  /* —— 探针 —— */
  healthz:      ["GET", "/healthz"],

  /* —— 总览与节点 —— */
  status:       ["GET", "/api/v1/status"],
  nodeAddress:  ["POST", "/api/v1/node/address"],
  nodeAccept:   ["POST", "/api/v1/node/accept"],
  nodeContacts: ["GET", "/api/v1/node/contacts"],
  nodeProfile:  ["PUT", "/api/v1/node/profile"],
  sendText:     ["POST", "/api/v1/send/text"],

  /* —— 联系人 —— */
  contacts:     ["GET", "/api/v1/contacts"],
  contactsSync: ["POST", "/api/v1/contacts/sync"],
  handshake:    ["POST", "/api/v1/contacts/{contact_id}/handshake"],
  revokeSession:["DELETE", "/api/v1/contacts/{contact_id}/session"],

  /* —— 菜单 —— */
  menuGet:      ["GET", "/api/v1/menu"],
  menuSet:      ["POST", "/api/v1/menu"],
  menuPush:     ["POST", "/api/v1/menu/push"],

  /* —— 卡片 —— */
  cards:        ["GET", "/api/v1/cards"],
  cardSend:     ["POST", "/api/v1/cards"],
  cardGet:      ["GET", "/api/v1/cards/{card_id}"],
  cardUpdate:   ["POST", "/api/v1/cards/{card_id}/update"],
  cardSettle:   ["POST", "/api/v1/cards/{card_id}/settle"],

  /* —— 频道 —— */
  channels:     ["GET", "/api/v1/channels"],
  inviteLink:   ["POST", "/api/v1/invite-links"],
  inviteAudit:  ["GET", "/api/v1/invite-links/audit"],
  channelCreate:["POST", "/api/v1/channels"],
  channelGet:   ["GET", "/api/v1/channels/{channel_id}"],
  channelUri:   ["PUT", "/api/v1/channels/{channel_id}/uri"],
  channelRotate:["POST", "/api/v1/channels/{channel_id}/rotate"],
  members:      ["GET", "/api/v1/channels/{channel_id}/members"],
  memberGrant:  ["POST", "/api/v1/channels/{channel_id}/members"],
  memberRevoke: ["DELETE", "/api/v1/channels/{channel_id}/members/{contact_id}"],

  /* —— 图文 —— */
  articles:     ["GET", "/api/v1/articles"],
  articlePut:   ["PUT", "/api/v1/articles/{article_id}"],
  articleGet:   ["GET", "/api/v1/articles/{article_id}"],
  articleSend:  ["POST", "/api/v1/articles/{article_id}/send"],

  /* —— 计费与激活码 —— */
  account:      ["GET", "/api/v1/billing/account"],
  ledger:       ["GET", "/api/v1/billing/ledger"],
  billingOnline:["POST", "/api/v1/billing/online"],
  billingSuspend:["POST", "/api/v1/billing/suspend"],
  billingGrant: ["POST", "/api/v1/billing/grant"],
  vouchers:     ["GET", "/api/v1/vouchers"],
  voucherVerify:["POST", "/api/v1/vouchers/verify"],
  voucherRedeem:["POST", "/api/v1/vouchers/redeem"],
  h5Auth:       ["POST", "/api/v1/verifyH5Auth"],

  /* —— 运维 —— */
  plugins:      ["GET", "/api/v1/plugins"],
  pluginStatus: ["GET", "/api/v1/plugins/{plugin_id}/status"],
  callbacks:    ["GET", "/api/v1/callbacks"],
  outbox:       ["GET", "/api/v1/outbox"],
  outboxDrain:  ["POST", "/api/v1/outbox/drain"],
  outboxDelete: ["DELETE", "/api/v1/outbox/{outbox_id}"],
  outboxRetry:  ["POST", "/api/v1/outbox/{outbox_id}/retry"],
  adminTokens:  ["GET", "/api/v1/admin/tokens"],
  adminTokenMint:["POST", "/api/v1/admin/tokens"],
  adminTokenAudit:["GET", "/api/v1/admin/tokens/audit"],
  adminTokenRevoke:["DELETE", "/api/v1/admin/tokens/{token_id}"],
  settings:     ["GET", "/api/v1/settings"],
  settingPut:   ["PUT", "/api/v1/settings/{key}"],
  diagnostics:  ["GET", "/api/v1/diagnostics"],

  /* —— 插件：AI 客服 —— */
  aiStatus:     ["GET", "/api/v1/plugins/ai/status"],
  aiChat:       ["POST", "/api/v1/plugins/ai/chat"],
  aiHistory:    ["GET", "/api/v1/plugins/ai/history"],
  aiHistoryDel: ["DELETE", "/api/v1/plugins/ai/history"],
  aiConfigure:  ["POST", "/api/v1/plugins/ai/configure"],
  aiExport:     ["GET", "/api/v1/plugins/ai/transcript/{contact_id}/export"],

  /* —— 插件：告警运营 —— */
  alertsStatus: ["GET", "/api/v1/plugins/alerts/status"],
  alertList:    ["GET", "/api/v1/plugins/alerts"],
  alertGet:     ["GET", "/api/v1/plugins/alerts/{alert_id}"],
  alertAck:     ["POST", "/api/v1/plugins/alerts/{alert_id}/ack"],
  alertResolve: ["POST", "/api/v1/plugins/alerts/{alert_id}/resolve"],
  alertTargets: ["GET", "/api/v1/plugins/alerts/targets"],

/* ======================================================================== *
 * 6b. 菜单可视化编排
 * ======================================================================== */

function emptyMenuItem() { return { title: "", kind: "click", action: "", payload: "", url: "", sub: [] }; }

function menuFromWire(items) {
  return (items || []).map(function (it) {
    return {
      title: String(it.title || ""),
      kind: String(it.kind || "click"),
      action: typeof it.action === "string" ? it.action : (it.action && it.action.action) || "",
      payload: String(it.payload || (it.action && it.action.payload) || ""),
      url: String(it.url || (it.action && it.action.url) || ""),
      sub: menuFromWire(it.sub || [])
    };
  });
}
function menuToWire(list) {
  return (list || []).map(function (it) {
    var out = { title: it.title, kind: it.kind };
    if (it.kind === "view") { out.action = "open_url"; out.url = it.url; out.sub = []; return out; }
    if (it.action) {
      out.action = it.action;
      if (it.action === "open_url") out.url = it.url;
      else if (it.action === "open_channel") out.payload = it.payload;
      else if (it.action === "send_cmd" || it.action === "callback") out.payload = it.payload;
    }
    out.sub = menuToWire(it.sub);
    return out;
  });
}
function menuProblems(list, top) {
  var bad = [];
  if (top && (!list || !list.length)) bad.push("菜单至少要有一个顶级项。");
  if (list && list.length > LIMITS.max_menu_items) bad.push("顶级项 " + list.length + " 个，客户端上限 " + LIMITS.max_menu_items + " 个。");
  var seen = {};
  (list || []).forEach(function (it, i) {
    var tag = (top ? "顶级项 " : "子项 ") + (i + 1);
    if (!String(it.title || "").trim()) bad.push(tag + "：标题为空。");
    if (String(it.title || "").length > LIMITS.max_menu_title_chars) bad.push(tag + "：标题超过 " + LIMITS.max_menu_title_chars + " 字符。");
    if (top) {
      if (seen[it.title]) bad.push(tag + "：标题与前面某项重复，客户端按标题唯一。");
      seen[it.title] = true;
    }
    if (MENU_ITEM_KINDS.indexOf(it.kind) < 0) bad.push(tag + "：未知类型 " + it.kind + "。");
    if (it.kind === "view") {
      if (!/^https?:\/\//i.test(it.url || "")) bad.push(tag + "：类型 view 需要 http(s) 链接。");
      if (it.sub && it.sub.length) bad.push(tag + "：类型 view 不允许子菜单。");
    } else if (it.kind === "scancode" || it.kind === "location") {
      if (it.action) bad.push(tag + "：类型 " + it.kind + " 由客户端本地处理，不能带动作。");
    } else if (it.action) {
      if (MENU_ACTION_KINDS.indexOf(it.action) < 0) bad.push(tag + "：菜单动作只能是 " + MENU_ACTION_KINDS.join("/") + "（收款必须走卡片）。");
      if (it.action === "open_url" && !/^https?:\/\//i.test(it.url || "")) bad.push(tag + "：open_url 需要 http(s) 链接。");
      if (it.action === "open_channel" && !/^popopx:\/\//i.test(it.payload || "")) bad.push(tag + "：open_channel 的 payload 必须是频道公开 URI（popopx://…）。");
      if ((it.action === "callback" || it.action === "send_cmd") && !String(it.payload || "").trim()) bad.push(tag + "：动作 " + it.action + " 需要 payload。");
      if (String(it.payload || "").length > LIMITS.payload) bad.push(tag + "：payload 超过 " + LIMITS.payload + " 字符。");
      if (String(it.url || "").length > LIMITS.url) bad.push(tag + "：url 超过 " + LIMITS.url + " 字符。");
    }
    if (it.sub && it.sub.length > LIMITS.max_menu_subitems) bad.push(tag + "：子项 " + it.sub.length + " 个，上限 " + LIMITS.max_menu_subitems + " 个。");
    if (!top && it.sub && it.sub.length) bad.push(tag + "：子菜单只到第二级，客户端遇到第三级会整条菜单不渲染。");
    if (it.sub && it.sub.length) bad = bad.concat(menuProblems(it.sub, false));
  });
  return bad;
}

function countOf(name) {
  var counts = (STATE.status || {}).counts;
  if (!counts) return 0;
  if (Array.isArray(counts)) {
    for (var i = 0; i < counts.length; i++) if (String(counts[i][0]) === name) return n(counts[i][1]);
    return 0;
  }
  return n(counts[name]);
}
